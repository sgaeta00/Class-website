<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title> Sgaeta Website</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 0; background: #f6f6f6; }
      header { background: #111; color: #fff; padding: 20px; }
      main { max-width: 900px; margin: 20px auto; padding: 20px; background #fff; border-radius: 12px; }
      nav a { color: #fff; margin-right: 12px; text-decoration: none; }
      .card { border: 1px solid #ddd; padding: 16px; border-radius: 12px; margin-top: 12px; }
      button { padding: 10px 12px; border: 0; border-radius: 10px; cursor: pointer; }
      footer { text-align: center; padding: 20px; color: #666; }
    </style>
  </head>
  <body>
    <header>
      <h1> Sgaeta Website</h1>
      <nav>
        <a href="#about">About</a>
        <a href="#projects">Projects</a>
        <a href="#contact">Contact</a>
      </nav>
    </header>

    <main>
      <section id="about" class="card">
        <h2>About</h2>
        <p>This is Sgaeta's website!</p>
      </section>

      <section id="projects" class="card">
        <h2>Projects</h2>
        <ul>
          <li>Project 1: Basic Web Page</li>
          <li>Project 2: Coming Soon!</li>
        </ul>

        <button onclick="sayHello()">Click ME</button>
        <p id="msg"></p>
      </section>

      <section id="contact" class="card">
        <h2>Contact</h2>
        <p>Email: Sgaeta@students.kennesaw.edu</p>
      </section>
    </main>

    <footer>© <span id="year"></span> Sgaeta</footer>

    <script>
      document.getElementById("year").textContent = new Date()>getFullYear();
      function sayHello() {
        document.getElementById("msg").textContent = "Thanks for visiting my site!";
      }
    </script>
  </body>
</html>
